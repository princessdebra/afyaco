# Only force "Connection: upgrade" for actual WebSocket requests (where the
# client sends an Upgrade header) — otherwise this would break keep-alive on
# every normal HTTP call proxied through the same /api/ location.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend — same-origin, so the SPA's relative /api/... calls just work
    # (no CORS, matches the Vite dev proxy's behavior).
    location /api/ {
        proxy_pass http://app:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket upgrade (chat) — nginx only forwards these headers, so a
        # plain HTTP request through this same location is unaffected.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Hashed asset filenames (index-XXXX.js/css) are safe to cache forever —
    # a content change always produces a new filename.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must NEVER be cached — every deploy replaces the hashed
    # asset files it references, so a cached index.html from an earlier
    # deploy points at files that no longer exist (blank white page, no
    # visible error, because the browser never re-checks). Mobile Safari in
    # particular caches aggressively across ngrok's stable domain, which is
    # exactly what happened here.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
